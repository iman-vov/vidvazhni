<html lang="uk">

    <style>
      html, body { margin: 0; height: 100%; background: #1b1d27; color: #e8ecf4; font: 14px system-ui, sans-serif; overflow: hidden; }
      #view { position: absolute; inset: 0; }
      #panel { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); z-index: 2; }
      #panel button, #panel select { font: inherit; min-height: 36px; padding: 4px 10px; border-radius: 8px; border: 1px solid #56647a; background: rgba(42, 51, 70, 0.92); color: inherit; }
      #panel button[aria-pressed='true'] { background: #ffc457; color: #1d2433; }
      #info { position: absolute; left: 10px; bottom: 10px; white-space: pre; font: 12px ui-monospace, monospace; background: rgba(20, 22, 30, 0.7); padding: 4px 8px; border-radius: 6px; z-index: 2; pointer-events: none; }
    </style>
  </head>
